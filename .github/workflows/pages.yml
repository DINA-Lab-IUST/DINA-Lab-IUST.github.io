name: Build DINA Lab stats and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 2 hours (UTC), away from the top of the hour.
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # This is a fallback snapshot, not a reason to skip the API request.
      - name: Restore last successful stats
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: data/github-stats.json
          key: dina-stats-v1-${{ vars.DINA_GITHUB_ORG }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dina-stats-v1-${{ vars.DINA_GITHUB_ORG }}-

      - name: Refresh organization stats
        env:
          GITHUB_ORG: ${{ vars.DINA_GITHUB_ORG }}
          DINA_GITHUB_TOKEN: ${{ secrets.DINA_GITHUB_TOKEN }}
          ACTIVITY_WINDOW_DAYS: 90
          # Optional: comma-separated repositories to omit from lab metrics.
          EXCLUDE_REPOS: ${{ vars.DINA_EXCLUDE_REPOS }}
        run: node scripts/update-github-stats.mjs

      - name: Save last successful stats for the next deployment
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: data/github-stats.json
          key: dina-stats-v1-${{ vars.DINA_GITHUB_ORG }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
