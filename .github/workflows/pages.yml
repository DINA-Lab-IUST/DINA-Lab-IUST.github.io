name: Build DINA Lab stats and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 6 hours, away from the top of the hour.
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh organization stats
        env:
          GITHUB_ORG: ${{ vars.DINA_GITHUB_ORG }}
          DINA_GITHUB_TOKEN: ${{ secrets.DINA_GITHUB_TOKEN }}
          ACTIVITY_WINDOW_DAYS: 90
          MAX_COMMIT_PAGES_PER_REPO: 20
        run: node scripts/update-github-stats.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
